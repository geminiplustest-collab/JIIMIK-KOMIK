<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Jiimik — JIYYAD TOOLS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@450;550;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0a0a0a;--elev:#111;--card:#161616;--line:#242424;--line2:#333;
  --text:#f5f5f5;--muted:#8a8a8a;--faint:#555;
  --accent:#fff;--ok:#a3a3a3;
  --font:Inter,system-ui,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);--bounce:cubic-bezier(.34,1.35,.64,1);
  --safe:env(safe-area-inset-bottom,0px);
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
*:focus{outline:none}
html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
img{display:block;max-width:100%}
button,input{font:inherit;color:inherit;background:none;border:none}
a{color:inherit;text-decoration:none}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(.94)}100%{opacity:1;transform:none}}
@keyframes introIn{0%{opacity:0;transform:scale(.85);filter:blur(10px)}100%{opacity:1;transform:none;filter:none}}
@keyframes introText{from{opacity:0;letter-spacing:.35em}to{opacity:1;letter-spacing:.14em}}
@keyframes bar{from{width:0;opacity:0}to{width:72px;opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes spin{to{transform:rotate(360deg)}}

.intro{position:fixed;inset:0;z-index:200;background:#000;display:flex;align-items:center;justify-content:center;transition:opacity .65s var(--ease),visibility .65s}
.intro.hide{opacity:0;visibility:hidden;pointer-events:none}
.intro-inner{text-align:center;padding:24px}
.intro-logo{width:84px;height:84px;margin:0 auto 16px;border-radius:20px;border:1px solid var(--line2);background:#111;overflow:hidden;animation:introIn .9s var(--ease) forwards;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px}
.intro-logo img{width:100%;height:100%;object-fit:contain}
.intro-name{font-size:20px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;opacity:0;animation:introText .85s var(--ease) .3s forwards}
.intro-tag{margin-top:8px;font-size:12px;color:var(--muted);opacity:0;animation:fadeUp .55s var(--ease) .5s forwards}
.intro-bar{height:1.5px;margin:16px auto 0;background:linear-gradient(90deg,transparent,#fff,transparent);animation:bar .75s var(--ease) .65s forwards}
.intro-dots{margin-top:14px;display:flex;gap:5px;justify-content:center;opacity:0;animation:fadeUp .45s var(--ease) .8s forwards}
.intro-dots i{width:5px;height:5px;border-radius:50%;background:#fff;animation:pulse 1s ease infinite}
.intro-dots i:nth-child(2){animation-delay:.15s}
.intro-dots i:nth-child(3){animation-delay:.3s}

.app{opacity:0;transition:opacity .45s;min-height:100vh;padding-bottom:calc(68px + var(--safe))}
.app.show{opacity:1}

.top{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;
  padding:10px 14px;background:rgba(10,10,10,.92);backdrop-filter:blur(14px);
  border-bottom:1px solid transparent;
}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:10px;border:1px solid var(--line2);background:#111;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px}
.brand-mark img{width:100%;height:100%;object-fit:contain}
.brand h1{font-size:15px;font-weight:800;letter-spacing:-.2px}
.brand p{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.45px}
.search{flex:1;position:relative;max-width:420px;margin-left:auto}
.search input{
  width:100%;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--elev);
  padding:0 38px 0 14px;font-size:13px;font-weight:600;color:var(--text);
}
.search input:focus{border-color:var(--line2)}
.search svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--muted);pointer-events:none}

.hero-strip{padding:14px 14px 6px;animation:fadeUp .45s var(--ease)}
.hero-strip h2{font-size:22px;font-weight:800;letter-spacing:-.4px;line-height:1.15}
.hero-strip p{margin-top:4px;font-size:12.5px;color:var(--muted);font-weight:550}

.section{padding:10px 0 2px;animation:fadeUp .5s var(--ease) both}
.section-head{display:flex;align-items:center;justify-content:space-between;padding:0 14px 10px}
.section-head h3{font-size:14px;font-weight:750}
.row{display:flex;gap:10px;overflow-x:auto;padding:0 14px 12px;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.row::-webkit-scrollbar{display:none}

.card{
  flex:0 0 auto;width:112px;scroll-snap-align:start;cursor:pointer;
  animation:pop .4s var(--bounce) both;transition:transform .2s var(--ease);
}
.card:active{transform:scale(.97)}
.card-cover{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.card-cover img{width:100%;height:100%;object-fit:cover}
.card-cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;color:var(--faint)}
.card-fav{
  position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.15);
  display:flex;align-items:center;justify-content:center;z-index:2;
}
.card-fav svg{width:13px;height:13px}
.card-fav.on{background:#fff;border-color:#fff}
.card-fav.on svg{stroke:#000;fill:#000}
.card-title{margin-top:6px;font-size:11.5px;font-weight:700;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-sub{font-size:10.5px;color:var(--muted);font-weight:600;margin-top:2px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:12px;padding:0 14px 16px}
.panel{display:none}
.panel.on{display:block;animation:fadeUp .35s var(--ease)}
.empty{text-align:center;padding:48px 16px;color:var(--muted);font-size:13px;font-weight:600}

/* DETAIL */
.overlay{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;flex-direction:column;overflow:auto}
.overlay.on{display:flex;animation:fadeIn .28s var(--ease)}
.ov-bar{
  position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;
  padding:10px 12px;background:rgba(10,10,10,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--elev);display:flex;align-items:center;justify-content:center;cursor:pointer}
.icon-btn svg{width:17px;height:17px}
.ov-bar h3{flex:1;font-size:13.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.detail-hero{display:flex;gap:14px;padding:16px 14px}
.detail-cover{width:120px;flex-shrink:0;aspect-ratio:2/3;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-info{flex:1;min-width:0}
.detail-info h2{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.2;margin-bottom:6px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);background:var(--elev)}
.detail-info p{font-size:12.5px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.detail-actions{display:flex;gap:8px;padding:0 14px 12px}
.btn{
  height:42px;padding:0 14px;border-radius:11px;font-size:13px;font-weight:750;
  display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  border:1px solid var(--line);transition:transform .15s var(--bounce);
}
.btn:active{transform:scale(.97)}
.btn-main{background:#fff;color:#000;border-color:#fff;flex:1}
.btn-ghost{background:var(--elev);color:var(--text)}
.btn-ghost.on{background:#fff;color:#000;border-color:#fff}

.ch-head{display:flex;align-items:center;justify-content:space-between;padding:8px 14px}
.ch-head h4{font-size:13px;font-weight:750}
.ch-list{padding:0 14px 24px}
.ch-item{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;
}
.ch-item:active{opacity:.7}
.ch-item b{font-size:13px;font-weight:700}
.ch-item span{font-size:11px;color:var(--muted);font-weight:600}

/* READER */
.reader{position:fixed;inset:0;z-index:90;background:#000;display:none;flex-direction:column}
.reader.on{display:flex}
.reader-bar{
  position:absolute;left:0;right:0;top:0;z-index:2;display:flex;align-items:center;gap:8px;
  padding:10px 12px;background:linear-gradient(180deg,rgba(0,0,0,.85),transparent);
  transition:opacity .3s,transform .3s;
}
.reader-bar.hide{opacity:0;pointer-events:none;transform:translateY(-8px)}
.reader-bar h3{flex:1;font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.reader-pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.reader-pages img{width:100%;height:auto;display:block;margin:0 auto;max-width:900px;background:#111}
.reader-nav{
  position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;gap:8px;justify-content:center;
  padding:12px 12px calc(12px + var(--safe));background:linear-gradient(0deg,rgba(0,0,0,.9),transparent);
  transition:opacity .3s,transform .3s;
}
.reader-nav.hide{opacity:0;pointer-events:none;transform:translateY(8px)}
.reader-nav .btn{min-width:110px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);color:#fff}
.reader-nav .btn:disabled{opacity:.35}

.bottom{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:flex;justify-content:space-around;padding:8px 6px calc(8px + var(--safe));
  background:rgba(10,10,10,.96);border-top:1px solid var(--line);backdrop-filter:blur(12px);
}
.bottom button{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:10px;font-weight:700;color:var(--muted);padding:4px;cursor:pointer;
}
.bottom button.on{color:#fff}
.bottom svg{width:20px;height:20px}

.loading{display:flex;justify-content:center;padding:40px}
.spin{width:22px;height:22px;border:2px solid var(--line2);border-top-color:#fff;border-radius:50%;animation:spin .65s linear infinite}
.toast{position:fixed;left:50%;bottom:calc(78px + var(--safe));transform:translateX(-50%) translateY(8px);background:#fff;color:#000;padding:10px 14px;border-radius:999px;font-size:12.5px;font-weight:750;opacity:0;pointer-events:none;transition:.25s;z-index:100}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(min-width:768px){
  .card{width:140px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));padding:0 24px 20px}
  .hero-strip,.section-head,.row,.detail-hero,.detail-actions,.ch-head,.ch-list{padding-left:24px;padding-right:24px}
  .top{padding-left:24px;padding-right:24px}
  .bottom{display:none}
  .app{padding-bottom:24px}
}
</style>
</head>
<body>
<div class="intro" id="intro">
  <div class="intro-inner">
    <div class="intro-logo"><img src="logo-jiyyad.png" alt="" onerror="this.remove();this.parentElement.textContent='JI'"/></div>
    <div class="intro-name">Jiimik</div>
    <div class="intro-tag">Membaca komik jadi mudah · JIYYAD TOOLS</div>
    <div class="intro-bar"></div>
    <div class="intro-dots"><i></i><i></i><i></i></div>
  </div>
</div>

<div class="app" id="app">
  <header class="top" id="top">
    <div class="brand" id="goHome">
      <div class="brand-mark"><img src="logo-jiyyad.png" alt="" onerror="this.parentElement.textContent='JI'"/></div>
      <div>
        <h1>Jiimik</h1>
        <p>Jiyyad Tools</p>
      </div>
    </div>
    <div class="search">
      <input id="q" type="search" placeholder="Cari komik..." autocomplete="off"/>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </div>
  </header>

  <div id="homeView">
    <div class="hero-strip">
      <h2>Baca komik lebih mudah</h2>
      <p>Latest · Popular · Favorit — powered by JIYYAD TOOLS</p>
    </div>
    <section class="section" style="animation-delay:.05s">
      <div class="section-head"><h3>Terbaru</h3></div>
      <div class="row" id="rowLatest"><div class="loading"><div class="spin"></div></div></div>
    </section>
    <section class="section" style="animation-delay:.1s">
      <div class="section-head"><h3>Populer</h3></div>
      <div class="row" id="rowPopular"><div class="loading"><div class="spin"></div></div></div>
    </section>
    <section class="section" style="animation-delay:.15s">
      <div class="section-head"><h3>Top</h3></div>
      <div class="row" id="rowTop"><div class="loading"><div class="spin"></div></div></div>
    </section>
  </div>

  <div class="panel" id="searchView">
    <div class="section-head"><h3 id="searchLabel">Hasil</h3></div>
    <div class="grid" id="searchGrid"></div>
    <div class="empty" id="searchEmpty" style="display:none">Tidak ada hasil</div>
  </div>

  <div class="panel" id="favView">
    <div class="section-head"><h3>Favorit</h3></div>
    <div class="grid" id="favGrid"></div>
    <div class="empty" id="favEmpty">Belum ada favorit</div>
  </div>
</div>

<!-- DETAIL -->
<div class="overlay" id="detail">
  <div class="ov-bar">
    <button class="icon-btn" id="closeDetail" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h3 id="detailTitle">—</h3>
    <button class="icon-btn" id="favDetailBtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg></button>
  </div>
  <div class="detail-hero">
    <div class="detail-cover"><img id="dCover" alt=""/></div>
    <div class="detail-info">
      <h2 id="dTitle">—</h2>
      <div class="meta" id="dMeta"></div>
      <p id="dDesc"></p>
    </div>
  </div>
  <div class="detail-actions">
    <button class="btn btn-main" id="readFirst" type="button">Baca chapter terbaru</button>
  </div>
  <div class="ch-head"><h4>Chapter</h4><span id="chCount" style="font-size:11px;color:var(--muted);font-weight:600"></span></div>
  <div class="ch-list" id="chList"><div class="loading"><div class="spin"></div></div></div>
</div>

<!-- READER -->
<div class="reader" id="reader">
  <div class="reader-bar" id="readerBar">
    <button class="icon-btn" id="closeReader" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h3 id="readerTitle">—</h3>
  </div>
  <div class="reader-pages" id="readerPages"></div>
  <div class="reader-nav" id="readerNav">
    <button class="btn" id="prevCh" type="button">‹ Prev</button>
    <button class="btn" id="nextCh" type="button">Next ›</button>
  </div>
</div>

<nav class="bottom">
  <button type="button" class="on" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"/></svg>Beranda</button>
  <button type="button" data-tab="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>Cari</button>
  <button type="button" data-tab="fav"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>Favorit</button>
</nav>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const FAV_KEY = 'jiimik_favs_v1';
let favs = loadFavs();
let currentManga = null;
let currentChapter = null;
let searchTimer = null;
let uiVisible = true;

function loadFavs(){ try{ return JSON.parse(localStorage.getItem(FAV_KEY)||'[]'); }catch{ return []; } }
function saveFavs(){ localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }
function isFav(id){ return favs.some(f=>f.id===id); }
function toggleFav(item){
  if(!item||!item.id) return;
  if(isFav(item.id)) favs = favs.filter(f=>f.id!==item.id);
  else favs.unshift({id:item.id,title:item.title,cover:item.cover,latest_chapter:item.latest_chapter,country:item.country});
  saveFavs();
  toast(isFav(item.id)?'Ditambah favorit':'Dihapus dari favorit');
  renderFavPage();
  updateFavButtons();
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._);toast._=setTimeout(()=>t.classList.remove('on'),2000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

function heartSvg(on){return `<svg viewBox="0 0 24 24" fill="${on?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>`}

function cardHTML(m, delay=0){
  if(!m||!m.id) return '';
  const on = isFav(m.id);
  return `<div class="card" style="animation-delay:${delay}s" data-id="${esc(m.id)}">
    <div class="card-cover">
      ${m.cover?`<img src="${esc(m.cover)}" alt="" loading="lazy" onerror="this.parentElement.innerHTML='<div class=ph>No Cover</div>'"/>`:'<div class="ph">No Cover</div>'}
      <button type="button" class="card-fav ${on?'on':''}" data-fav="${esc(m.id)}" aria-label="Favorit">${heartSvg(on)}</button>
    </div>
    <div class="card-title">${esc(m.title)}</div>
    <div class="card-sub">${esc([m.country, m.latest_chapter!==''&&m.latest_chapter!=null?'Ch.'+m.latest_chapter:''].filter(Boolean).join(' · '))}</div>
  </div>`;
}
function bindCards(root){
  root.querySelectorAll('.card').forEach(el=>{
    el.onclick = (e)=>{
      if(e.target.closest('[data-fav]')) return;
      openDetail(el.dataset.id);
    };
  });
  root.querySelectorAll('[data-fav]').forEach(btn=>{
    btn.onclick = (e)=>{
      e.stopPropagation();
      const id = btn.dataset.fav;
      const card = btn.closest('.card');
      const title = card?.querySelector('.card-title')?.textContent || '';
      const cover = card?.querySelector('img')?.src || '';
      toggleFav({id,title,cover});
      btn.classList.toggle('on', isFav(id));
      btn.innerHTML = heartSvg(isFav(id));
    };
  });
}

async function loadHome(){
  try{
    const r = await fetch('/api/home');
    const d = await r.json();
    if(!d.status) throw new Error(d.error||'Gagal');
    $('#rowLatest').innerHTML = (d.latest||[]).map((x,i)=>cardHTML(x,i*0.02)).join('')||'<div class="empty">Kosong</div>';
    $('#rowPopular').innerHTML = (d.popular||[]).map((x,i)=>cardHTML(x,i*0.02)).join('')||'<div class="empty">Kosong</div>';
    $('#rowTop').innerHTML = (d.top||[]).map((x,i)=>cardHTML(x,i*0.02)).join('')||'<div class="empty">Kosong</div>';
    bindCards($('#rowLatest')); bindCards($('#rowPopular')); bindCards($('#rowTop'));
  }catch(e){
    $('#rowLatest').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}

async function openDetail(id){
  $('#detail').classList.add('on');
  $('#detailTitle').textContent = 'Memuat…';
  $('#chList').innerHTML = '<div class="loading"><div class="spin"></div></div>';
  try{
    const [md, cd] = await Promise.all([
      fetch('/api/manga/'+id).then(r=>r.json()),
      fetch('/api/chapters/'+id+'?page=1&size=80').then(r=>r.json()),
    ]);
    const m = md.manga || {};
    currentManga = m;
    $('#detailTitle').textContent = m.title || '—';
    $('#dTitle').textContent = m.title || '—';
    $('#dCover').src = m.cover || '';
    $('#dDesc').textContent = m.description || 'Tidak ada sinopsis.';
    $('#dMeta').innerHTML = [
      m.country?`<span class="chip">${esc(m.country)}</span>`:'',
      m.latest_chapter!==''&&m.latest_chapter!=null?`<span class="chip">Ch. ${esc(m.latest_chapter)}</span>`:'',
      ...(m.genres||[]).slice(0,4).map(g=>`<span class="chip">${esc(g)}</span>`)
    ].join('');
    updateFavButtons();
    const chs = cd.chapters || [];
    $('#chCount').textContent = (cd.meta?.total_record || chs.length) + ' ch';
    $('#chList').innerHTML = chs.map(c=>`
      <div class="ch-item" data-cid="${esc(c.id)}">
        <b>Chapter ${esc(c.number)}${c.title?': '+esc(c.title):''}</b>
        <span>${esc((c.released||'').toString().slice(0,10))}</span>
      </div>`).join('') || '<div class="empty">Belum ada chapter</div>';
    $('#chList').querySelectorAll('.ch-item').forEach(el=>{
      el.onclick = ()=> openReader(el.dataset.cid);
    });
    $('#readFirst').onclick = ()=>{ if(chs[0]) openReader(chs[0].id); else toast('Tidak ada chapter'); };
  }catch(e){ toast(e.message||'Error'); }
}
function updateFavButtons(){
  const on = currentManga && isFav(currentManga.id);
  const btn = $('#favDetailBtn');
  btn.innerHTML = heartSvg(!!on);
  btn.style.background = on ? '#fff' : '';
  btn.style.color = on ? '#000' : '';
}
$('#favDetailBtn').onclick = ()=>{ if(currentManga){ toggleFav(currentManga); updateFavButtons(); } };
$('#closeDetail').onclick = ()=> $('#detail').classList.remove('on');

async function openReader(chapterId){
  $('#reader').classList.add('on');
  $('#readerTitle').textContent = 'Memuat…';
  $('#readerPages').innerHTML = '<div class="loading"><div class="spin"></div></div>';
  uiVisible = true;
  $('#readerBar').classList.remove('hide');
  $('#readerNav').classList.remove('hide');
  try{
    const r = await fetch('/api/read/'+chapterId);
    const d = await r.json();
    if(!d.status) throw new Error(d.error||'Gagal');
    currentChapter = d.chapter;
    $('#readerTitle').textContent = `Ch. ${d.chapter.number}` + (currentManga?.title ? ' · '+currentManga.title : '');
    const pages = d.chapter.pages || [];
    $('#readerPages').innerHTML = pages.map((p,i)=>`<img src="${esc(p)}" alt="page ${i+1}" loading="${i<3?'eager':'lazy'}"/>`).join('') || '<div class="empty">Tidak ada halaman</div>';
    $('#readerPages').scrollTop = 0;
    $('#prevCh').disabled = !d.chapter.prev_chapter_id;
    $('#nextCh').disabled = !d.chapter.next_chapter_id;
    $('#prevCh').onclick = ()=>{ if(d.chapter.prev_chapter_id) openReader(d.chapter.prev_chapter_id); };
    $('#nextCh').onclick = ()=>{ if(d.chapter.next_chapter_id) openReader(d.chapter.next_chapter_id); };
  }catch(e){
    $('#readerPages').innerHTML = `<div class="empty">${esc(e.message)}</div>`;
  }
}
$('#closeReader').onclick = ()=>{
  $('#reader').classList.remove('on');
  $('#readerPages').innerHTML = '';
};
$('#readerPages').addEventListener('click', ()=>{
  uiVisible = !uiVisible;
  $('#readerBar').classList.toggle('hide', !uiVisible);
  $('#readerNav').classList.toggle('hide', !uiVisible);
});

function showTab(tab){
  $$('.bottom button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  $('#homeView').style.display = tab==='home' ? 'block' : 'none';
  $('#searchView').classList.toggle('on', tab==='search');
  $('#favView').classList.toggle('on', tab==='fav');
  if(tab==='fav') renderFavPage();
}
function renderFavPage(){
  const list = favs;
  $('#favGrid').innerHTML = list.map((x,i)=>cardHTML(x,i*0.02)).join('');
  bindCards($('#favGrid'));
  $('#favEmpty').style.display = list.length ? 'none' : 'block';
}
$$('.bottom button').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));
$('#goHome').onclick = ()=> showTab('home');

$('#q').addEventListener('input', ()=>{
  clearTimeout(searchTimer);
  const q = $('#q').value.trim();
  if(!q){ showTab('home'); return; }
  searchTimer = setTimeout(async ()=>{
    showTab('search');
    $('#searchLabel').textContent = `Hasil: “${q}”`;
    $('#searchGrid').innerHTML = '<div class="loading"><div class="spin"></div></div>';
    try{
      const r = await fetch('/api/search?q='+encodeURIComponent(q));
      const d = await r.json();
      const list = d.results||[];
      $('#searchGrid').innerHTML = list.map((x,i)=>cardHTML(x,i*0.02)).join('');
      bindCards($('#searchGrid'));
      $('#searchEmpty').style.display = list.length?'none':'block';
    }catch(e){
      $('#searchGrid').innerHTML='';
      $('#searchEmpty').style.display='block';
      $('#searchEmpty').textContent=e.message;
    }
  }, 350);
});

window.addEventListener('scroll',()=>$('#top').classList.toggle('scrolled', scrollY>12),{passive:true});

setTimeout(()=>{
  $('#intro').classList.add('hide');
  $('#app').classList.add('show');
  setTimeout(()=>{$('#intro').style.display='none'},700);
  loadHome();
}, 2400);
</script>
</body>
</html>
